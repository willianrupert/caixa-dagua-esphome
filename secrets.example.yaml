# Modelo de credenciais — copie para secrets.yaml e preencha.
# O secrets.yaml real está no .gitignore e NUNCA deve ser versionado.

wifi_ssid: "SuaRedePrincipal"
wifi_ssid_2: "SuaRedeAlternativa"
wifi_password: "sua-senha-wifi"

# Chave de criptografia da API nativa (32 bytes em base64):
#   openssl rand -base64 32
api_key: "GERE-UMA-CHAVE-AQUI"

# Senha de gravação OTA:
#   openssl rand -hex 16
ota_password: "GERE-UMA-SENHA-AQUI"

# Senha do AP de emergência (hotspot que o ESP32 sobe se não achar Wi-Fi)
ap_password: "escolha-uma-senha"
