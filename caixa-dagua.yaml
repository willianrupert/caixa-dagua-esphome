# =====================================================================
#  SISTEMA DE BOMBEAMENTO CISTERNA -> CAIXA D'ÁGUA
#  ESP32-S3 + ESPHome + Home Assistant
#
#  Implementa a FSM do MEMORIAL-DESCRITIVO.md:
#    E0 Standby | E1 Pré-partida | E2 Recalque Crítico
#    E3 Recalque Interm./Manual  | E4 Sucesso
#    E5 Falha Contator (corrente fantasma)
#    E6 Falha Corrente Alta      | E7 Falha Corrente Baixa
#    E8 Modo Pausa (soberano)    | E9 Boot Seguro (rotina, não estado salvo)
#
#  Toda a lógica de segurança roda 100% LOCAL no ESP32.
#  Wi-Fi/Home Assistant são apenas telemetria e conveniência.
# =====================================================================

substitutions:
  # ------------- PINOS (ESP32-S3) -------------
  # O projeto nasceu para ESP32-C3 e migrou para S3 em 2026-08-25, quando a
  # placa que apareceu na bancada era S3. NÃO é só trocar o `board:` — o mapa
  # inteiro mudou, porque o que é pino limpo no C3 não é no S3:
  #
  #   GPIO0  era o ADC das boias no C3. No S3 é STRAPPING de boot e costuma
  #          estar ligado ao botão BOOT da placa. Saiu.
  #   GPIO20 era o UART RX do PZEM no C3. No S3 é o D+ do USB nativo —
  #          conflita com a própria gravação. Saiu (junto com GPIO19, o D-).
  #   GPIO3  era a grade principal no C3. No S3 é strapping (seleção de
  #          JTAG). Saiu.
  #   GPIO8  era strapping no C3 (log de boot). No S3 é limpo — aqui melhora,
  #          e a ressalva "não testado no boot" que existia some.
  #
  # Também evitados por princípio: GPIO26..37 (flash/PSRAM do módulo),
  # GPIO43/44 (UART0 da ponte USB-serial), GPIO45/46 (strapping) e GPIO48
  # (LED RGB embutido em boa parte das placas S3).
  #
  # ADC: no S3 só o ADC1 (GPIO1..GPIO10) funciona com o Wi-Fi ligado — o ADC2
  # é disputado com o rádio. Por isso as boias têm que morar nessa faixa.
  pino_adc_boias: GPIO4   # matriz das 2 boias (2 fios) — ADC1_CH3
  pino_botao: GPIO5       # contato seco do botão da cozinha (via UTP)
  pino_uart_tx: GPIO9     # -> RX do PZEM-004T
  pino_uart_rx: GPIO10    # <- TX do PZEM-004T
  pino_led_r: GPIO16      # -> anodo R do botão, via resistor em série
  pino_led_g: GPIO17      # -> anodo G do botão, via resistor em série
  pino_led_b: GPIO18      # -> anodo B do botão, via resistor em série
  pino_rele: GPIO21       # -> módulo relé 5V (IN, ativo em HIGH) -> contator

  # NeoPixel embutido na própria placa S3 — espelha o LED do botão, para que
  # o estado seja legível no quadro sem ir até a cozinha. GPIO48 é o pino na
  # maioria das placas S3; algumas usam GPIO38. Se o LED não acender, é o
  # primeiro lugar a trocar.
  pino_led_placa: GPIO48

  # Expansão — sensores de porta (microswitches, contato seco).
  # No S3 os três são pinos limpos, sem ressalva de strapping.
  pino_grade_principal: GPIO6    # 2 microswitches em série — grade principal do serviço
  pino_grade_secundaria: GPIO7   # 2 microswitches em série — grade secundária
  pino_porta_cozinha: GPIO8      # 1 microswitch — porta de madeira da cozinha

  # ------------- CALIBRAÇÃO (ajustar na instalação) -------------
  # Matriz de boias SUPERVISIONADA (laço com resistor de fim de linha):
  #   - Pull-up de 4.7kΩ do nó ADC para o 3V3 DO PRÓPRIO ESP32 (no quadro).
  #     Tem que ser esse 3V3 e não outra fonte: é a mesma tensão que o ADC usa
  #     como referência, e qualquer diferença entre as duas vira erro direto na
  #     leitura de nível.
  #     CUIDADO ao ler a lista de peças: existem DOIS resistores de 4.7kΩ neste
  #     projeto, em lugares diferentes — este pull-up, no quadro, e o da boia
  #     MÁXIMA, dentro da caixinha selada. Não são intercambiáveis.
  #     O projeto nasceu com 3.3kΩ aqui (melhor folga, 0.62V); 4.7kΩ foi o que
  #     havia em mãos e dá 0.46V de folga mínima, folgado o bastante. Trocar o
  #     valor exige recalcular os 4 limiares abaixo.
  #   - Capacitor cerâmico 100nF (código 104) do nó ao GND — filtro de RF do
  #     cabo que desce da caixa. Cerâmico de propósito: eletrolítico tem ESR e
  #     indutância altas e não filtra a faixa que interessa.
  #   - Resistor EOL de 10kΩ em paralelo com as boias (NO LADO DA CAIXA!) —
  #     é ele que torna o cabo rompido detectável.
  #
  # AS DUAS BOIAS FECHAM SECAS (contato fecha com a água ABAIXO delas), e a
  # razão é fail-safe, não convenção. Em 2026-08-25 as duas foram giradas 180°
  # para tratar um transbordo e o desenho inteiro foi reavaliado: girar quebra
  # DUAS coisas de uma vez. A causa do transbordo era uma infiltração na
  # entrada de água da caixa, resolvida na hidráulica — que é onde problema
  # hidráulico se resolve. NÃO GIRE AS BOIAS. Detalhes em
  # MEMORIAL-DESCRITIVO.md 4.1.1; o resumo é:
  #
  #   1) "Cheia" aqui é a AUSÊNCIA de qualquer contato fechado (só o EOL no
  #      laço). Reed morto, fio rompido ou emenda corroída => ausência de
  #      sinal => lê CHEIA => desliga a bomba. Se a máxima fechasse molhada,
  #      "cheia" passaria a EXIGIR um contato vivo, e o mesmo defeito viraria
  #      "ainda não encheu" => bomba segue => transbordo.
  #   2) Com as duas fechando molhadas, "intermediário" (1k∥10k = 909R) e
  #      "cheia" (1k∥4.7k∥10k = 762R) caem a ~90mV um do outro — dois estados
  #      NORMAIS, que se alternam a cada enchimento, indistinguíveis dentro da
  #      tolerância de +-5% dos resistores.
  #
  # Tensões resultantes (pull-up de 4.7kΩ):
  #   cabo ROMPIDO / sem boia (circuito aberto)  ~3.3V  -> FALHA SENSOR
  #   ambas abertas (10kΩ)          = CHEIA        ~2.25V
  #   só máx fechada (4.7k∥10k)     = INTERMEDIÁRIO ~1.34V
  #   ambas fechadas (1k∥4.7k∥10k)  = CRÍTICO      ~0.46V
  #   cabo em CURTO                               ~0.0V  -> FALHA SENSOR
  #
  # ---- LIMIARES MEDIDOS EM CAMPO (2026-08-26) ----
  # Estes NÃO são os valores teóricos do divisor: são os que o ADC desta
  # placa realmente reporta em cada estado, medidos com as boias na mão.
  # O ADC do S3 soma um offset fixo de ~0.35V (confirmado comparando o pino
  # com multímetro: nó em 0.71V, ADC reportando 1.05V), e o laço mostra ~500R
  # a mais que o medido isolado, provavelmente resistência de contato. Em vez
  # de corrigir as duas coisas e torcer, os limiares ficam no meio do que se
  # observou. Se o hardware for mexido, remeça em vez de recalcular.
  #
  #   crítico       1.05V  |  intermediário 2.40V  |  cheia 3.17V
  #
  # LIMITAÇÃO CONHECIDA — detecção de cabo rompido está DESLIGADA.
  # "Cheia" reporta 3.17V, que é o teto deste ADC; cabo rompido reporta o
  # mesmo valor, então os dois são indistinguíveis. O limiar abaixo está em
  # 3.30V, acima do que o conversor consegue produzir, justamente para NÃO
  # disparar falso alarme em caixa cheia.
  # A falha cai para o lado seguro: cabo rompido é lido como "cheia", a bomba
  # não liga, e a caixa simplesmente para de encher — ninguém se molha e o
  # motor não roda seco. Resolver de verdade exige atacar o offset do ADC ou
  # baixar a escala do divisor. Ver MEMORIAL-DESCRITIVO.md 4.1.
  adc_sem_sensor_acima_de: "3.30"     # inalcançável de propósito (ver acima)
  adc_cheia_acima_de: "2.78"          # meio entre 2.40 e 3.17
  adc_intermediario_acima_de: "1.72"  # meio entre 1.05 e 2.40
  adc_curto_abaixo_de: "0.50"         # crítico lê 1.05; curto real lê ~0
  sensor_falho_leituras: "15"         # leituras (1s) fora das faixas p/ declarar falha

  # Bomba Intech BSCA2 1/4 HP 220V — corrente máxima/mínima e o tempo máximo
  # de inching viraram `number` ajustáveis pelo Home Assistant (seção NÚMEROS
  # DE CONFIGURAÇÃO, mais abaixo). Os valores abaixo são só os defaults de
  # fábrica usados na 1ª partida (depois disso quem manda é o valor salvo).

  # Janela entre "decidiu bombear" e o relé fechar. Era 5s, com o LED em
  # vermelho sólido anunciando a partida; virou 300ms em 2026-08-26 porque o
  # anúncio custava mais do que valia. Quem dá o clique já está na frente do
  # botão e não precisa ser avisado, e a espera longa fazia a interface
  # parecer travada. O passo continua existindo: o pre_partida_timer relê o
  # estado antes de fechar o contator, então uma pausa ou uma mudança de
  # nível no meio ainda aborta a partida.
  tempo_pre_partida: 300ms
  tempo_verde_sucesso: 60s # duração do LED verde em E4
  blanking_ms: "5000"      # cegueira de partida do PZEM (ms)

  corrente_fantasma: "0.5"       # A — corrente com relé DESLIGADO = contator soldado (E5)
  fantasma_grace_ms: "10000"     # ms de tolerância após desligar (cauda de leitura do PZEM)
  nivel_leituras_estaveis: "4"   # histerese: leituras consecutivas (1s cada) para
                                 # aceitar mudança de nível (anti-marola/anti-ruído)

esphome:
  name: caixa-dagua
  friendly_name: "Caixa D'Água"
  # PlatformIO não compila em caminhos com espaço/apóstrofo ("Caixas d'águas")
  build_path: /Users/willian/.esphome-builds/caixa-dagua
  on_boot:
    # E9 — Rotina de Boot Seguro: roda em TODO boot (volta de apagão).
    # NUNCA religa a bomba direto: sempre reavalia boias + E1 + blanking.
    priority: -100
    then:
      # Liga o espelho da placa e deixa rodando para sempre — daqui em diante
      # ninguém mais comanda o led_placa, ele só observa o led_cozinha.
      - light.turn_on:
          id: led_placa
          brightness: 100%
          effect: "Espelho do Botao"
      - script.execute: boot_seguro

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Gravação por evento: escreve na NVS imediatamente quando um global
# restaurável muda (só há mudança em transição de estado -> pouquíssimas
# gravações/dia, sem desgaste da flash).
preferences:
  flash_write_interval: 0s

logger:
  # No ESP32-S3 o ESPHome manda o log para a USB nativa (USB_SERIAL_JTAG) por
  # padrão. A gravação, porém, acontece pela UART0 (GPIO43/44) através do
  # adaptador FTDI — e a USB nativa desta placa não aceita o auto-reset do
  # esptool, então é pelo FTDI que se grava. Com o padrão, gravar e ler log
  # exigiriam dois cabos em portas diferentes, e a serial ficava muda no cabo
  # que estava na mão. UART0 põe as duas coisas no mesmo lugar.
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_key
  # NUNCA reiniciar por falta de cliente HA — a lógica é 100% local.
  # (O padrão do ESPHome é reiniciar após 15 min sem conexão!)
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  # NUNCA reiniciar por falta de Wi-Fi — a lógica é 100% local.
  reboot_timeout: 0s

  # O padrão do ESPHome para ESP32 é LIGHT, e aqui ele quebrava a integração:
  # com o rádio dormindo entre beacons, o ping na LAN oscilava em dente-de-serra
  # de 61ms a 409ms e o handshake da API do Home Assistant não completava — o
  # dispositivo pingava, anunciava por mDNS e abria a porta 6053, mas ficava
  # "unavailable" no HA (diagnosticado em 2026-08-26, com tudo já montado).
  # Esta placa é alimentada pela rede, não por bateria: não há energia a
  # economizar, e o preço era a telemetria do sistema de controle.
  power_save_mode: NONE
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_ssid_2
      password: !secret wifi_password
  ap:
    ssid: "Caixa-Dagua Fallback"
    password: !secret ap_password

captive_portal:

# =====================================================================
#  ESTADO PERSISTENTE
# =====================================================================
globals:
  # Estado lógico da FSM — a ÚNICA coisa salva na flash.
  # (Nunca salvamos o estado do relé físico.)
  - id: fsm_state
    type: int
    restore_value: true
    initial_value: '0'

  - id: manual_mode
    type: bool
    restore_value: false
    initial_value: 'false'

  # 0=Cheia | 1=Intermediário | 2=Crítico | 3=Desconhecido | 4=FALHA SENSOR
  - id: water_level
    type: int
    restore_value: false
    initial_value: '3'

  # Contagem de leituras fora das faixas válidas (supervisão do sensor)
  - id: sensor_falho_contagem
    type: int
    restore_value: false
    initial_value: '0'

  # millis() do momento em que o relé ligou (para o blanking do PZEM)
  - id: pump_started_at
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # millis() do momento em que o relé desligou (tolerância da corrente fantasma)
  - id: pump_stopped_at
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # true = E8 foi ativado pelo inching (automático), não pelo usuário.
  # Restaurável: após apagão, a pausa automática continua piscando.
  - id: pausa_automatica
    type: bool
    restore_value: true
    initial_value: 'false'

  # Passo da varredura de matiz do boot (0..PASSOS_BOOT-1)
  - id: boot_anim_passo
    type: int
    restore_value: false
    initial_value: '0'

  # Histerese do nível: candidato e contagem de leituras estáveis
  - id: nivel_candidato
    type: int
    restore_value: false
    initial_value: '3'
  - id: nivel_contagem
    type: int
    restore_value: false
    initial_value: '0'

  # ---- Teste manual da bomba (mede corrente p/ calibrar os `number`) ----
  - id: teste_ativo
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: teste_inicio
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: teste_regime
    type: float
    restore_value: false
    initial_value: 'NAN'

# =====================================================================
#  NÚCLEO DA FSM
# =====================================================================
script:
  # ---- Transição central de estado (todas as mudanças passam aqui) ----
  - id: goto_state
    parameters:
      novo: int
    then:
      - lambda: |-
          static const char *NOMES[] = {
            "E0 Standby", "E1 Pre-partida", "E2 Recalque Critico",
            "E3 Recalque Interm./Manual", "E4 Caixa Cheia (Sucesso)",
            "E5 FALHA Contator", "E6 FALHA Corrente Alta",
            "E7 FALHA Corrente Baixa", "E8 Modo Pausa"};
          ESP_LOGI("fsm", "Transicao -> %s", NOMES[novo]);
          id(fsm_state) = novo;  // persiste na flash (flash_write_interval: 0s)
          id(fsm_texto).publish_state(NOMES[novo]);
          id(nome_dispositivo).publish_state("Caixa D'Água");

          const char *st = "Standby";
          if (novo == 0) {
            int lvl = id(water_level);
            if (lvl == 0)      st = "Cheia";
            else if (lvl == 1) st = "Intermediária";
            else if (lvl == 2) st = "Nível Baixo";
            else if (lvl == 4) st = "Falha Sensor";
            else               st = "Standby";
          } else if (novo == 1) {
            st = "Iniciando...";
          } else if (novo == 2 || novo == 3) {
            st = "Enchendo...";
          } else if (novo == 4) {
            st = "Enchimento Concluído";
          } else if (novo == 5) {
            st = "Falha Contator";
          } else if (novo == 6) {
            st = "Falha Rotor Preso";
          } else if (novo == 7) {
            st = "Falha Sem Água";
          } else if (novo == 8) {
            st = "Pausada";
          }
          id(status_amigavel).publish_state(st);

          // cancela timers de estados anteriores
          id(pre_partida_timer).stop();
          id(sucesso_timer).stop();

          if (novo != 1 && novo != 3) id(manual_mode) = false;
          if (novo != 8) id(pausa_automatica) = false;

          // --- Última Ocorrência: registro do "porquê" para debugging ---
          if (novo == 5)      id(ocorrencia_texto).publish_state("Corrente com rele DESLIGADO: contator soldado OU chave em MANUAL");
          else if (novo == 6) id(ocorrencia_texto).publish_state("Rotor preso (sobrecorrente)");
          else if (novo == 7) id(ocorrencia_texto).publish_state("Bomba a seco (subcorrente)");
          else if (novo == 8 && id(pausa_automatica)) {
            char buf[80];
            snprintf(buf, sizeof(buf), "Inching: %.0f min sem encher - verificar boia superior",
                     id(numero_tempo_maximo_bomba).state);
            id(ocorrencia_texto).publish_state(buf);
          }

          // --- Bomba: liga somente em E2/E3; qualquer outro estado desliga ---
          // O limite de tempo (inching) segue o RELÉ, não o estado: a transição
          // E2->E3 não reinicia a contagem dos 10 minutos.
          bool bomba = (novo == 2 || novo == 3);
          if (bomba && !id(rele_bomba).state) {
            id(pump_started_at) = millis();  // inicia blanking do PZEM
            id(rele_bomba).turn_on();
            id(limite_bomba_timer).execute();
          } else if (!bomba && id(rele_bomba).state) {
            id(rele_bomba).turn_off();  // pausa/falha desligam IMEDIATAMENTE
            id(pump_stopped_at) = millis();  // tolerância da corrente fantasma
            id(limite_bomba_timer).stop();
          }

          // --- LED RGB da cozinha (fades suaves em PWM / respiração nos alarmes) ---
          // Alarmes usam o efeito "pulse" (respiração de brilho, 4s de período)
          // sobre a MESMA cor sólida do estado — por isso a cor é escolhida uma
          // única vez abaixo e reaproveitada tanto no efeito quanto no sólido.
          //
          // A varredura de matiz do boot é decoração e SEMPRE perde para o
          // estado: qualquer transição real a interrompe aqui, antes de pintar
          // a cor. Sem isto, uma partida automática durante o boot ficaria
          // escondida atrás do arco-íris ainda em curso.
          id(animacao_boot).stop();

          const char *efeito = nullptr;
          if (novo == 5)      efeito = "Falha Branco";
          else if (novo == 6) efeito = "Falha Vermelho";
          else if (novo == 7) efeito = "Falha Azul";
          else if (novo == 8 && id(pausa_automatica)) efeito = "Pausa Piscando";

          if (novo == 0) {
            auto c = id(led_cozinha).turn_off();
            c.set_effect("None");
            c.set_transition_length(800);
            c.perform();
          } else {
            float r = 0, g = 0, b = 0;
            switch (novo) {
              // E1 não tem cor própria: mostra JÁ a cor do estado que vai
              // assumir. Antes era vermelho sólido, que na tabela de cores
              // significa "caixa vazia" — dizer isso durante uma partida
              // manual com a caixa pela metade era a interface mentindo.
              // A condição abaixo espelha exatamente a decisão do
              // pre_partida_timer; se uma mudar, a outra tem que mudar junto.
              case 1:
                if (!id(manual_mode) && id(water_level) == 2) { r = 1; b = 1; }  // roxo, vira E2
                else                                          { b = 1; }        // azul, vira E3
                break;
              case 2: r = 1; b = 1; break;  // Roxo/Pink: enchendo crítico
              case 3: b = 1;        break;  // Azul: intermediário/manual
              case 4: g = 1;        break;  // Verde: sucesso
              case 5: r = 1; g = 1; b = 1; break;  // Branco: falha contator soldado
              case 6: r = 1;        break;  // Vermelho: falha sobrecorrente
              case 7: b = 1;        break;  // Azul: falha subcorrente
              case 8: r = 1; g = 1; break;  // Amarelo: Pausa (sólido=manual, pulsando=automática)
            }
            auto c = id(led_cozinha).turn_on();
            c.set_effect(efeito != nullptr ? efeito : "None");
            c.set_brightness(1.0);
            c.set_rgb(r, g, b);
            c.set_transition_length(600);
            c.perform();
          }

          // --- Timers do novo estado ---
          if (novo == 1) id(pre_partida_timer).execute();
          if (novo == 4) id(sucesso_timer).execute();

  # ---- Animação de boot: varredura de matiz até a cor do estado ----
  # NÃO adiciona tempo ao boot. Ela cabe dentro dos 2s que o boot_seguro já
  # gastava parado, estabilizando a leitura do ADC — o tempo era o mesmo, só
  # não tinha o que mostrar. Termina em ~1.94s, uma folga antes de goto_state
  # pintar a cor do estado com o fade normal de 600ms: o arco-íris se resolve
  # na cor que significa alguma coisa, em vez de cortar seco.
  #
  # Varre 360° de matiz em 24 passos de 15°, com transição (75ms) maior que o
  # passo (70ms) de propósito: cada comando interrompe o anterior no meio do
  # fade, então a cor nunca "chega e senta" — é movimento contínuo, não 24
  # saltos. Saturação e brilho ficam no máximo o tempo todo; a única coisa
  # que muda é o matiz.
  - id: animacao_boot
    mode: single
    then:
      # Entrada: do escuro para o vermelho, o fade que abre a animação.
      - lambda: |-
          id(boot_anim_passo) = 0;
          auto c = id(led_cozinha).turn_on();
          c.set_effect("None");
          c.set_rgb(1, 0, 0);
          c.set_brightness(1.0);
          c.set_transition_length(260);
          c.perform();
      - delay: 260ms
      - repeat:
          count: 24
          then:
            - lambda: |-
                // HSV -> RGB com S=1 e V=1: nesse caso um canal está sempre
                // em 1, outro em 0, e só o terceiro cruza a rampa. É a mesma
                // conta que o hexágono de matiz faz, escrita à mão porque não
                // vale puxar uma biblioteca de cor para seis linhas.
                float h = id(boot_anim_passo) * (360.0f / 24.0f);
                id(boot_anim_passo)++;
                float x = 1.0f - fabsf(fmodf(h / 60.0f, 2.0f) - 1.0f);
                float r = 0, g = 0, b = 0;
                if      (h <  60) { r = 1; g = x;        }
                else if (h < 120) { r = x; g = 1;        }
                else if (h < 180) {        g = 1; b = x; }
                else if (h < 240) {        g = x; b = 1; }
                else if (h < 300) { r = x;        b = 1; }
                else              { r = 1;        b = x; }
                auto c = id(led_cozinha).turn_on();
                c.set_rgb(r, g, b);
                c.set_brightness(1.0);
                c.set_transition_length(75);
                c.perform();
            - delay: 70ms

  # ---- E1: delay de pré-partida, depois decide E2 ou E3 ----
  - id: pre_partida_timer
    mode: restart
    then:
      - delay: ${tempo_pre_partida}
      - lambda: |-
          if (id(fsm_state) != 1) return;  // pausa/nível cancelaram no meio
          if (id(manual_mode))            id(goto_state).execute(3);
          else if (id(water_level) == 2)  id(goto_state).execute(2);
          else                            id(goto_state).execute(3);

  # ---- E4: verde por 1 minuto, depois volta ao Standby ----
  - id: sucesso_timer
    mode: restart
    then:
      - delay: ${tempo_verde_sucesso}
      - lambda: |-
          if (id(fsm_state) == 4) id(goto_state).execute(0);

  # ---- Feedback de clique quando não há ação real a fazer (caixa já cheia) ----
  # As duas rotinas abaixo são puramente visuais: não tocam em fsm_state, não
  # gravam na flash, não reiniciam timer nenhum. Existem pra responder ao
  # clique sem monopolizar o LED — clicar 5x com a caixa cheia não pode dar
  # 5 rodadas de 60s de verde sólido nem 5 gravações na NVS.
  #
  # Pulso a partir do Standby (LED apagado): "liguei" -> "já está cheia,
  # olha o pisco" -> apaga de novo. Não entra em E4 de verdade.
  - id: pulso_feedback_standby
    then:
      - lambda: |-
          auto c = id(led_cozinha).turn_on();
          c.set_rgb(0, 1, 0);
          c.set_brightness(1.0);
          c.set_effect("None");
          c.set_transition_length(80);
          c.perform();
      - delay: 350ms
      - lambda: |-
          if (id(fsm_state) != 0) return;  // saiu do Standby no meio do pulso
          auto c = id(led_cozinha).turn_off();
          c.set_transition_length(250);
          c.perform();

  # Pulso a partir do sucesso (LED verde já aceso, dentro da janela de 1 min):
  # apaga rápido e volta pro verde sólido — reconhece o clique sem dispensar
  # o sucesso nem reiniciar os 60s do sucesso_timer.
  - id: pulso_feedback_sucesso
    then:
      - lambda: |-
          auto c = id(led_cozinha).turn_off();
          c.set_transition_length(80);
          c.perform();
      - delay: 250ms
      - lambda: |-
          if (id(fsm_state) != 4) return;  // os 60s estouraram no meio do pulso
          auto c = id(led_cozinha).turn_on();
          c.set_rgb(0, 1, 0);
          c.set_brightness(1.0);
          c.set_effect("None");
          c.set_transition_length(250);
          c.perform();

  # ---- Inching: tempo máximo de bomba ligada (proteção contra boia quebrada) ----
  # Se a boia superior quebrar e nunca sinalizar "cheia", a bomba não pode
  # ficar ligada para sempre. Após ${numero_tempo_maximo_bomba} contínuos, o
  # sistema entra em MODO PAUSA (E8): desliga tudo, LED amarelo, e fica
  # travado até o clique longo do usuário (falha exige inspeção humana).
  - id: limite_bomba_timer
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t)(id(numero_tempo_maximo_bomba).state * 60000);'
      - lambda: |-
          if (id(fsm_state) == 2 || id(fsm_state) == 3) {
            ESP_LOGW("fsm", "INCHING: bomba ligada ha %.0f min sem encher - boia superior pode ter quebrado. Entrando em MODO PAUSA.",
                     id(numero_tempo_maximo_bomba).state);
            id(pausa_automatica) = true;  // pausa AUTOMATICA: amarelo piscando
            id(goto_state).execute(8);
          }

  # ---- Teste manual da bomba: mede corrente de regime ----
  # Só roda a partir do Standby (E0), fora da FSM normal, por uma janela fixa
  # e travada de 10s — serve para calibrar numero_corrente_maxima/minima com
  # segurança, sem depender só da pinça amperimétrica na instalação.
  - id: testar_bomba
    then:
      - if:
          condition:
            lambda: 'return id(fsm_state) == 0 && !id(rele_bomba).state;'
          then:
            - lambda: |-
                id(teste_regime) = NAN;
                id(teste_inicio) = millis();
                id(teste_ativo) = true;
                id(pzem_bomba).set_update_interval(1000);  // amostragem rápida durante o teste
                auto c = id(led_cozinha).turn_on();
                c.set_rgb(1, 1, 1);
                c.set_brightness(1.0);
                c.set_transition_length(300);
                c.perform();
            - switch.turn_on: rele_bomba
            - delay: 10s
            - switch.turn_off: rele_bomba
            - lambda: |-
                // Sem isso, o teste some com a proteção de "cauda de leitura do
                // PZEM" (fantasma_grace_ms) que a FSM normal sempre aplica ao
                // desligar a bomba (ver goto_state) — o relé aqui é comandado
                // direto, fora do goto_state, então ninguém mais atualiza isto.
                id(pump_stopped_at) = millis();
            - delay: 500ms
            - lambda: |-
                id(teste_ativo) = false;
                id(pzem_bomba).set_update_interval(3000);
                auto c = id(led_cozinha).turn_off();
                c.set_transition_length(500);  // explícito: não depender do default
                c.perform();
                char buf[96];
                if (!std::isnan(id(teste_regime))) {
                  id(teste_regime_sensor).publish_state(id(teste_regime));
                  snprintf(buf, sizeof(buf), "Teste manual: regime %.2f A", id(teste_regime));
                } else {
                  snprintf(buf, sizeof(buf), "Teste manual: regime nao capturado");
                }
                id(ocorrencia_texto).publish_state(buf);
          else:
            - logger.log:
                level: WARN
                tag: teste
                format: "Teste de bomba ignorado: sistema nao esta pronto em Standby"

  # ---- E9: Rotina de Boot Seguro (recuperação de apagão) ----
  - id: boot_seguro
    then:
      # Dispara e segue: a animação roda DENTRO dos 2s abaixo, não depois.
      # script.execute não bloqueia, então o boot não fica um milissegundo
      # mais lento por causa dela.
      - script.execute: animacao_boot
      - delay: 2s   # estabiliza a leitura do ADC e absorve flicker de rede
      - lambda: |-
          int salvo = id(fsm_state);
          ESP_LOGI("fsm", "E9 Boot Seguro. Estado gravado na flash: %d", salvo);
          if (salvo == 8) {                       // caiu em Pausa -> permanece travado
            id(goto_state).execute(8);            // (pausa_automatica restaurada da flash)
          } else if (salvo >= 5 && salvo <= 7) {  // caiu em Falha -> exige reset manual
            id(goto_state).execute(salvo);
          } else if (salvo >= 1 && salvo <= 3) {  // caiu enchendo -> reteste completo
            if (id(water_level) == 0) id(goto_state).execute(0);  // já encheu
            else id(goto_state).execute(1);       // E1: 5s + bomba + blanking do zero
          } else {                                // E0/E4 -> pronto
            id(goto_state).execute(0);
          }

  # ---- Clique Curto (< 1.0s): liga/desliga manual ou reset de falha ----
  - id: clique_curto
    then:
      - lambda: |-
          switch (id(fsm_state)) {
            case 0:  // liga manual
              if (id(water_level) == 0) {
                // Caixa já cheia: pulso rápido de verde (feedback) em vez de
                // reiniciar os 60s de sucesso — clique repetido não pode
                // monopolizar o LED nem gravar na flash de novo.
                ESP_LOGI("fsm", "Partida manual ignorada: caixa ja esta cheia (pulso de feedback)");
                id(pulso_feedback_standby).execute();
              } else {
                id(manual_mode) = true;
                id(goto_state).execute(1);
              }
              break;
            case 3:  // desliga enchimento manual/intermediário
              id(goto_state).execute(0);
              break;
            case 4:  // já em sucesso: pisca pra confirmar o clique, sem dispensar o verde
              id(pulso_feedback_sucesso).execute();
              break;
            case 5:  // reconhece falha de contator (se a corrente persistir, E5 volta em ~3s)
            case 6:
            case 7:  // reconhece a falha; boias reavaliam e religam com E1+blanking
              ESP_LOGI("fsm", "Falha reconhecida pelo usuario");
              id(goto_state).execute(0);
              break;
            default:  // E1, E2 e E8 ignoram o clique curto
              break;
          }

  # ---- Clique Longo (>= 1.5s): Modo Pausa soberano, de QUALQUER estado ----
  - id: clique_longo
    then:
      - lambda: |-
          if (id(fsm_state) == 8) {
            // Sai da pausa: limpa a memória e reavalia a casa (via boias -> E1)
            ESP_LOGI("fsm", "Saindo do Modo Pausa - reavaliando a casa");
            id(goto_state).execute(0);
          } else {
            ESP_LOGI("fsm", "MODO PAUSA ativado (manutencao)");
            id(pausa_automatica) = false;  // pausa MANUAL: amarelo solido
            id(goto_state).execute(8);
          }

# =====================================================================
#  ENTRADAS
# =====================================================================
binary_sensor:
  # Botão inox da cozinha (contato seco no UTP, fecha para GND)
  - platform: gpio
    id: botao_cozinha
    name: "Botão Cozinha"
    pin:
      number: ${pino_botao}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_multi_click:
      # Clique longo: dispara AOS 1.5s, ainda com o botão pressionado
      - timing:
          - ON for at least 1.5s
        then:
          - script.execute: clique_longo
      # Clique curto: solto antes de 1.0s (zona morta entre 1.0s e 1.5s)
      - timing:
          - ON for at most 1s
          - OFF for at least 0.3s
        then:
          - script.execute: clique_curto

  - platform: template
    name: "Bomba Ligada"
    device_class: running
    lambda: return id(rele_bomba).state;

  - platform: status
    name: "Status Wi-Fi"

  # ---- As 3 portas da área de serviço. Cada uma é 1 GPIO só — nas duas
  # grades, os 2 microswitches ficam em SÉRIE entre si (mesma lógica de zona
  # de alarme): o "os dois confirmam" já acontece no cobre, então só descem
  # 2 fios por grade e o ESP32 nem sabe que são 2 switches, só vê 1 laço.
  # Contato NA, fecha para GND quando atuado (lingueta avançada / porta
  # encostada). SEM `inverted` de propósito: pino em repouso (pull-up,
  # HIGH) = "aberta/não confirmada" — cabo cortado, switch desconectado OU
  # qualquer um dos dois em série aberto caem no mesmo estado. Nunca
  # aparenta "trancada"/"fechada" por engano. Mesma filosofia de fail-safe
  # da matriz de boias. Ver MANUAL-FIACAO.md seção 9 e MEMORIAL-DESCRITIVO.md
  # 4.3 (por que essa polaridade, não a oposta).
  - platform: gpio
    id: grade_principal
    name: "Grade Principal (Serviço)"
    device_class: door
    pin:
      number: ${pino_grade_principal}
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

  - platform: gpio
    id: grade_secundaria
    name: "Grade Secundária (Serviço)"
    device_class: door
    pin:
      number: ${pino_grade_secundaria}
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

  # Porta de madeira da cozinha — vias 7/8 do mesmo UTP do botão/LED, até
  # então não usadas (ver MANUAL-FIACAO.md seção 5 e 9). Só 1 switch, sem
  # série. device_class `lock` porque este é o ponto de acesso final antes
  # da cozinha — se preferir tratá-la como porta simples (sem noção de
  # "trancada"), troque para `door`, é só cosmético no HA.
  - platform: gpio
    id: trava_cozinha
    name: "Trava Madeira Cozinha"
    device_class: lock
    pin:
      number: ${pino_porta_cozinha}
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

# =====================================================================
#  SENSORES
# =====================================================================
uart:
  tx_pin: ${pino_uart_tx}
  rx_pin: ${pino_uart_rx}
  baud_rate: 9600

modbus:

sensor:
  # ---- Matriz das 2 boias em 2 fios (leitura analógica) ----
  - platform: adc
    id: boias_adc
    name: "Tensão Boias"
    pin: ${pino_adc_boias}
    attenuation: 12db
    update_interval: 1s
    accuracy_decimals: 2
    filters:
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
    on_value:
      then:
        - lambda: |-
            static const char *LVL[] = {"Cheia", "Intermediario", "Critico"};

            // ----- Supervisão do laço (EOL): sensor desconectado ou em curto -----
            // Fora das faixas válidas: cabo rompido (>2.9V), curto (<0.35V)
            // ou pino flutuando (sem nada conectado). Sustentado por
            // ${sensor_falho_leituras}s -> FALHA SENSOR: pausa automática.
            bool falho = (x > ${adc_sem_sensor_acima_de}) || (x < ${adc_curto_abaixo_de});
            if (falho) {
              id(sensor_falho_contagem)++;
              if (id(sensor_falho_contagem) >= ${sensor_falho_leituras} && id(water_level) != 4) {
                id(water_level) = 4;
                id(nivel_texto).publish_state("FALHA SENSOR");
                ESP_LOGE("nivel", "SENSOR DE BOIAS INVALIDO (%.2f V) - rompido, em curto ou desconectado!", x);
                id(ocorrencia_texto).publish_state("Sensor de boias rompido/curto/desconectado");
                int s = id(fsm_state);
                if (s >= 0 && s <= 3) {  // parado ou enchendo: exige inspeção
                  id(pausa_automatica) = true;
                  id(goto_state).execute(8);
                }
              }
              return;  // leitura inválida não alimenta a histerese de nível
            }
            id(sensor_falho_contagem) = 0;

            int bruto;
            if (x > ${adc_cheia_acima_de})              bruto = 0;  // Cheia
            else if (x > ${adc_intermediario_acima_de}) bruto = 1;  // Intermediário
            else                                        bruto = 2;  // Crítico

            // ----- Histerese: só aceita mudança após N leituras estáveis -----
            // Evita que a marola na boia (E2<->E3) pisque o LED e desgaste a
            // flash com gravações repetidas. 1ª leitura pós-boot (ou pós-falha
            // de sensor) entra pela histerese normal de ${nivel_leituras_estaveis}s.
            if (id(water_level) == 3) {
              id(water_level) = bruto;
              id(nivel_texto).publish_state(LVL[bruto]);
              ESP_LOGI("nivel", "Nivel inicial: %s (%.2f V)", LVL[bruto], x);
              if (id(fsm_state) == 0) {
                if (bruto == 0)      id(status_amigavel).publish_state("Cheia");
                else if (bruto == 1) id(status_amigavel).publish_state("Intermediária");
                else if (bruto == 2) id(status_amigavel).publish_state("Nível Baixo");
              }
            } else if (bruto == id(water_level)) {
              id(nivel_contagem) = 0;  // leitura confirma o nível atual
            } else {
              if (bruto == id(nivel_candidato)) id(nivel_contagem)++;
              else { id(nivel_candidato) = bruto; id(nivel_contagem) = 1; }
              if (id(nivel_contagem) >= ${nivel_leituras_estaveis}) {
                id(water_level) = bruto;
                id(nivel_contagem) = 0;
                id(nivel_texto).publish_state(LVL[bruto]);
                ESP_LOGI("nivel", "Nivel: %s (%.2f V)", LVL[bruto], x);
                if (id(fsm_state) == 0) {
                  if (bruto == 0)      id(status_amigavel).publish_state("Cheia");
                  else if (bruto == 1) id(status_amigavel).publish_state("Intermediária");
                  else if (bruto == 2) id(status_amigavel).publish_state("Nível Baixo");
                }
              }
            }

            // ----- Transições automáticas pelo nível ACEITO -----
            int s = id(fsm_state);
            int lvl = id(water_level);
            if (s == 8 || s == 5 || s == 6 || s == 7) return;  // Pausa/Falha ignoram boias
            if (lvl > 2) return;                               // nível desconhecido/falho
            if (s == 0 && lvl == 2)              id(goto_state).execute(1);  // auto-partida
            else if (s == 1 && lvl == 0)         id(goto_state).execute(0);  // encheu na espera
            else if (s == 2 && lvl == 1)         id(goto_state).execute(3);  // saiu do crítico
            else if ((s == 2 || s == 3) && lvl == 0) id(goto_state).execute(4);  // SUCESSO

  # ---- PZEM-004T V3 (10A, shunt interno) via Modbus/UART ----
  - platform: pzemac
    id: pzem_bomba
    update_interval: 3s
    current:
      name: "Corrente da Bomba"
      id: corrente_bomba
      accuracy_decimals: 2
      on_value:
        then:
          # ----- Amostragem do teste manual da bomba (não interfere na FSM) -----
          - lambda: |-
              if (!id(teste_ativo) || std::isnan(x)) return;
              uint32_t dt = millis() - id(teste_inicio);
              if (dt >= 4000 && std::isnan(id(teste_regime))) {
                id(teste_regime) = x;  // corrente já assentada (regime)
              }
              // Segurança absoluta do teste: corrente muito acima do limite
              // configurado corta a bomba na hora, sem esperar os 10s do teste.
              if (x > id(numero_corrente_maxima).state * 2.0f) {
                ESP_LOGE("teste", "Teste abortado: corrente %.2f A muito acima do limite!", x);
                id(rele_bomba).turn_off();
                id(teste_ativo) = false;
                auto c = id(led_cozinha).turn_off();
                c.set_transition_length(500);  // explícito: não depender do default
                c.perform();
              }
          - lambda: |-
              if (std::isnan(x)) return;
              int s = id(fsm_state);

              // ----- CORRENTE FANTASMA: contator soldado (E5) -----
              // Relé comandado DESLIGADO mas o motor consome corrente:
              // os contatos do relé/contator soldaram fechados. O software
              // não consegue cortar (defeito mecânico) — alarma para o
              // usuário desligar o disjuntor. Vale em QUALQUER estado.
              //
              // A chave de bypass em MANUAL produz EXATAMENTE esta assinatura,
              // e não há como distinguir pela corrente: nos dois casos o motor
              // gira sem o relé ter mandado. O alarme continua disparando de
              // propósito — suprimir seria abrir mão da única detecção de
              // contator soldado que existe — mas o texto agora nomeia as duas
              // causas, em vez de acusar defeito quando pode ser o operador.
              // O bypass existe para quando o ESP32 morreu, e aí não há
              // ninguém para alarmar; testá-lo com a placa desligada é o teste
              // fiel ao cenário real E evita o alarme. Ver MANUAL-FIACAO.md 10.
              if (!id(rele_bomba).state && s != 5 &&
                  x > ${corrente_fantasma} &&
                  (millis() - id(pump_stopped_at)) > ${fantasma_grace_ms}) {
                ESP_LOGE("fsm", "CORRENTE FANTASMA %.2f A com rele desligado - contator soldado OU chave em MANUAL. Se nao for o bypass, desligue o disjuntor!", x);
                id(goto_state).execute(5);
                return;
              }

              if (s != 2 && s != 3) return;          // demais checks: só com bomba ligada
              if (!id(rele_bomba).state) return;
              // Blanking time: cegueira de 5s na partida (pico de arranque)
              if (millis() - id(pump_started_at) < ${blanking_ms}) return;
              if (x > id(numero_corrente_maxima).state) {
                ESP_LOGW("fsm", "SOBRECORRENTE %.2f A (limite %.2f A) - rotor preso!", x, id(numero_corrente_maxima).state);
                id(goto_state).execute(6);
              } else if (x < id(numero_corrente_minima).state) {
                ESP_LOGW("fsm", "SUBCORRENTE %.2f A (limite %.2f A) - bomba a seco!", x, id(numero_corrente_minima).state);
                id(goto_state).execute(7);
              }
    voltage:
      name: "Tensão da Rede"
      accuracy_decimals: 1
    power:
      name: "Potência da Bomba"
      accuracy_decimals: 1
    energy:
      name: "Energia Consumida"

  - platform: wifi_signal
    name: "Sinal Wi-Fi"
    update_interval: 60s
    entity_category: diagnostic

  # ---- Resultado do teste manual da bomba (ver script testar_bomba) ----
  - platform: template
    id: teste_regime_sensor
    name: "Corrente de Regime (Teste)"
    icon: mdi:current-ac
    unit_of_measurement: "A"
    accuracy_decimals: 2
    device_class: current

# =====================================================================
#  SAÍDAS
# =====================================================================
switch:
  # Relé: módulo pronto 5V ligado direto no ESP32.
  # Módulo é ativo em HIGH (trigger jumper em "H"): GPIO7 em nível ALTO liga
  # o relé — por isso SEM inverted (turn_on() já manda HIGH direto).
  # Confirme no datasheet do seu módulo o estado padrão do IN quando o GPIO
  # está flutuando (antes do ESPHome assumir o pino no boot) — idealmente ele
  # mantém o relé desligado nesse instante, reforçando o ALWAYS_OFF abaixo.
  # Interno: SÓ a FSM comanda a bomba. ALWAYS_OFF: boot cru nunca religa —
  # quem decide é a E9 (boot_seguro).
  - platform: gpio
    id: rele_bomba
    pin: ${pino_rele}
    restore_mode: ALWAYS_OFF
    internal: true

output:
  # O botão da cozinha é CATODO COMUM (um "-" compartilhado no GND, três "+"
  # independentes), descoberto com o botão em mãos em 2026-08-26. Cada anodo
  # vai direto no GPIO, com resistor em série — sem YYNMOS, que era chave
  # low-side e só serve para anodo comum. O módulo saiu do projeto.
  #
  # A polaridade dá certo nas duas topologias, e por isso a troca não custou
  # uma linha de firmware: com o YYNMOS, PWM alto fechava o canal e puxava o
  # catodo ao GND; ligado direto, PWM alto põe o anodo em 3.3V. Nos dois
  # casos PWM alto = aceso, logo NÃO se usa inverted aqui.
  #
  # O LED é alimentado por 3.3V (o GPIO), não pelos 5V de antes. O botão é
  # especificado para 3-6V, então está na faixa — mas azul e verde têm tensão
  # direta perto de 3.0V e sobra pouca margem. Ver MANUAL-FIACAO.md 5.1.
  - platform: ledc
    id: out_r
    pin: ${pino_led_r}
  - platform: ledc
    id: out_g
    pin: ${pino_led_g}
  - platform: ledc
    id: out_b
    pin: ${pino_led_b}

light:
  # ---- NeoPixel embutido na placa: espelho do LED do botão ----
  # Mostra o mesmo estado no quadro, sem precisar ir até a cozinha — útil
  # tanto na bancada quanto para conferir a instalação com a porta do quadro
  # aberta.
  #
  # O espelhamento é por AMOSTRAGEM, não por duplicação de comandos. Um
  # efeito lê `current_values` do led_cozinha a cada 50ms — e `current_values`
  # é o valor JÁ INTERPOLADO da transição em curso, não o alvo. Consequência:
  # o NeoPixel reproduz sozinho os fades, a respiração dos alarmes, os pulsos
  # de clique e a varredura de boot, sem que nenhum desses lugares saiba que
  # ele existe. Duplicar os comandos nos seis pontos que tocam o LED daria o
  # mesmo resultado hoje e divergiria no primeiro que alguém esquecesse.
  #
  # `internal: true`: é réplica de uma entidade que o HA já tem. Expor as duas
  # só suja a lista.
  - platform: esp32_rmt_led_strip
    id: led_placa
    internal: true
    pin: ${pino_led_placa}
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    default_transition_length: 0s
    effects:
      - addressable_lambda:
          name: "Espelho do Botao"
          update_interval: 50ms
          lambda: |-
            // as_rgb() já entrega estado x brilho x cor combinados, que é
            // exatamente o que sai nos PWM do botão naquele instante.
            float r, g, b;
            id(led_cozinha).current_values.as_rgb(&r, &g, &b);
            it[0] = Color((uint8_t)(r * 255.0f), (uint8_t)(g * 255.0f), (uint8_t)(b * 255.0f));

  - platform: rgb
    id: led_cozinha
    name: "LED Botão Cozinha"
    red: out_r
    green: out_g
    blue: out_b
    default_transition_length: 500ms
    effects:
      # Alarmes "respiram" em vez de piscar em onda quadrada: brilho sobe e desce
      # em rampa PWM suave (mesma curva de transição usada nos fades normais),
      # 4s de período total, sem nunca apagar de vez (min_brightness > 0).
      # A cor em si (quem está sólida) é fixada por set_rgb() antes do efeito,
      # já que o "pulse" só modula o brilho.
      - pulse:
          name: "Falha Vermelho"
          transition_length: 1900ms
          update_interval: 2s
          min_brightness: 15%
          max_brightness: 100%
      - pulse:
          name: "Falha Azul"
          transition_length: 1900ms
          update_interval: 2s
          min_brightness: 15%
          max_brightness: 100%
      # E5 Contator soldado (alarme máximo): mesma respiração de 4s
      - pulse:
          name: "Falha Branco"
          transition_length: 1900ms
          update_interval: 2s
          min_brightness: 15%
          max_brightness: 100%
      # E8 por inching (automático): respiração amarela —
      # distingue da pausa manual (amarelo sólido, sem pulso)
      - pulse:
          name: "Pausa Piscando"
          transition_length: 1900ms
          update_interval: 2s
          min_brightness: 15%
          max_brightness: 100%

# =====================================================================
#  NÚMEROS DE CONFIGURAÇÃO (ajustáveis pelo Home Assistant)
# =====================================================================
# `restore_value` grava na flash: uma vez ajustado pelo usuário, o valor
# sobrevive a reboot/OTA. O valor inicial é o mesmo default histórico
# do projeto (10 min / 3.0 A / 0.5 A).
number:
  - platform: template
    id: numero_tempo_maximo_bomba
    name: "Tempo Máximo da Bomba (Inching)"
    icon: mdi:timer-alert-outline
    unit_of_measurement: min
    min_value: 2
    max_value: 30
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 10

  - platform: template
    id: numero_corrente_maxima
    name: "Corrente Máxima (Rotor Preso)"
    icon: mdi:current-ac
    unit_of_measurement: "A"
    min_value: 0.5
    max_value: 8.0
    step: 0.1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 3.0

  - platform: template
    id: numero_corrente_minima
    name: "Corrente Mínima (Bomba a Seco)"
    icon: mdi:current-ac
    unit_of_measurement: "A"
    min_value: 0.1
    max_value: 3.0
    step: 0.05
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0.5

# =====================================================================
#  INTERFACE COM O HOME ASSISTANT
# =====================================================================
text_sensor:
  - platform: template
    id: fsm_texto
    name: "Estado do Sistema"
    icon: mdi:state-machine

  - platform: template
    id: nivel_texto
    name: "Nível da Caixa"
    icon: mdi:water-percent

  - platform: template
    id: status_amigavel
    name: "Status"
    icon: mdi:information-outline

  - platform: template
    id: nome_dispositivo
    name: "Dispositivo"
    icon: mdi:water-pump

  # Registro do "porquê" do último alarme (E5/E6/E7/inching) — post-mortem
  - platform: template
    id: ocorrencia_texto
    name: "Última Ocorrência"
    icon: mdi:alert-circle-outline

button:
  # Espelham exatamente o botão físico — mesma lógica, sem atalhos inseguros
  - platform: template
    id: botao_clique_curto
    name: "Clique Curto (Liga-Desliga-Reset)"
    icon: mdi:gesture-tap-button
    on_press:
      - script.execute: clique_curto

  - platform: template
    id: botao_clique_longo
    name: "Clique Longo (Modo Pausa)"
    icon: mdi:pause-octagon
    on_press:
      - script.execute: clique_longo

  # Roda a bomba por 10s a partir do Standby, medindo corrente de partida
  # e de regime — usar para calibrar os `number` de corrente acima.
  - platform: template
    name: "Testar Bomba (Medir Corrente)"
    icon: mdi:test-tube
    on_press:
      - script.execute: testar_bomba
